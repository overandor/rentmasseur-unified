[package]
name = "rentmasseur_extractor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bio_extractor"
path = "src/main.rs"

[[bin]]
name = "city_extractor"
path = "src/city_extractor.rs"

[[bin]]
name = "city_profile_extractor"
path = "src/city_profile_extractor.rs"

[[bin]]
name = "bulk_extractor"
path = "src/bulk_extractor.rs"

[[bin]]
name = "test_pagination"
path = "src/test_pagination.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
