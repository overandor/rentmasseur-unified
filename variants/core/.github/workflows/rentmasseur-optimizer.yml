name: RentMasseur Optimizer

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'strategies/**'
      - 'requirements.txt'
      - '.github/workflows/rentmasseur-optimizer.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      skip_bio:
        description: 'Skip bio update'
        required: false
        default: 'false'
      skip_availability:
        description: 'Skip availability'
        required: false
        default: 'false'
      headless:
        description: 'Run browser headless'
        required: false
        default: 'true'
      capture_screens:
        description: 'Capture demo screenshots'
        required: false
        default: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile *.py strategies/*.py

      - name: Verify imports and CLI
        run: |
          python -c "import intent_router, rentmasseur_core, rentmasseur_coordinator, rentmasseur_optimizer"
          python rentmasseur_coordinator.py --help

  optimize:
    needs: validate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@master

      - name: Install virtual display
        if: github.event.inputs.headless == 'false'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run optimizer
        env:
          RENTMASSEUR_USERNAME: ${{ secrets.RENTMASSEUR_USERNAME }}
          RENTMASSEUR_PASSWORD: ${{ secrets.RENTMASSEUR_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "llama-3.3-70b-versatile"
          RENTMASSEUR_CAPTURE_SCREENS: ${{ github.event.inputs.capture_screens || 'false' }}
          RUN_HEADLESS: ${{ github.event.inputs.headless || 'true' }}
        run: |
          if [ "$RUN_HEADLESS" = "false" ]; then
            xvfb-run -a python rentmasseur_coordinator.py \
              --headless false \
              --pick-best \
              ${{ github.event.inputs.skip_bio == 'true' && '--skip-bio' || '' }} \
              ${{ github.event.inputs.skip_availability == 'true' && '--skip-availability' || '' }}
          else
            python rentmasseur_coordinator.py \
              --headless true \
              --pick-best \
              ${{ github.event.inputs.skip_bio == 'true' && '--skip-bio' || '' }} \
              ${{ github.event.inputs.skip_availability == 'true' && '--skip-availability' || '' }}
          fi

      - name: Upload debug artifacts
        if: failure() || github.event.inputs.capture_screens == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: debug/
          retention-days: 3
