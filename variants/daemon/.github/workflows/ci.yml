name: RM RevenueOps CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python
        run: python3 -m compileall server.py rm_revenue_engine/ rm_pri/

      - name: Secret scan
        run: |
          if grep -RInE "RENTMASSEUR_PASSWORD|RM_PASSWORD|GROQ_API_KEY|OPENROUTER|hf_[A-Za-z0-9]{30,}|Bearer\s+[A-Za-z0-9]{20,}|Lola369" . \
            --exclude-dir=.git --exclude-dir=.github --exclude="*.pyc" --exclude-dir=__pycache__ --exclude-dir=private_secrets_quarantine \
            --exclude=".dockerignore" --exclude=".gitignore"; then
            echo "SECRETS FOUND — FAILING BUILD"
            exit 1
          else
            echo "No secrets detected"
          fi

      - name: Check Dockerfile exists
        run: test -f Dockerfile && echo "Dockerfile OK" || (echo "MISSING Dockerfile" && exit 1)

      - name: Check .dockerignore exists
        run: test -f .dockerignore && echo ".dockerignore OK" || (echo "MISSING .dockerignore" && exit 1)

      - name: API smoke tests
        run: |
          python3 -c "
          from fastapi.testclient import TestClient
          from server import app
          c = TestClient(app)

          # Health
          r = c.get('/api/health')
          assert r.status_code == 200, f'health failed: {r.status_code}'
          print('PASS: /api/health')

          # Decision states
          r = c.get('/api/decision-states')
          assert r.status_code == 200
          states = r.json()['states']
          assert 'BLOCK_NO_SIGNAL' in states
          assert 'KEEP_CURRENT' in states
          assert 'WINNER_FOUND' in states
          print(f'PASS: /api/decision-states ({len(states)} states)')

          # Candidates
          r = c.get('/api/candidates')
          assert r.status_code == 200
          print(f'PASS: /api/candidates')

          # Metrics ingest
          r = c.post('/api/metrics/ingest', json={
              'date': '2026-06-26',
              'bio_id': 'ci_test',
              'profile_views': 500,
              'contact_clicks': 30,
              'new_visits': 10,
              'new_emails': 2,
              'availability_state': True,
              'profile_visible': True,
          })
          assert r.status_code == 200, f'ingest failed: {r.status_code} {r.text}'
          decision = r.json()['decision']['status']
          print(f'PASS: /api/metrics/ingest -> {decision}')

          # Decision latest
          r = c.get('/api/decision/latest')
          assert r.status_code == 200
          print('PASS: /api/decision/latest')

          # Experiments
          r = c.get('/api/experiments/current')
          assert r.status_code == 200
          print('PASS: /api/experiments/current')

          # Metrics history
          r = c.get('/api/metrics/history')
          assert r.status_code == 200
          print('PASS: /api/metrics/history')

          # Receipts
          r = c.get('/api/receipts/latest')
          assert r.status_code == 200
          print('PASS: /api/receipts/latest')

          r = c.get('/api/receipts/verify')
          assert r.status_code == 200
          assert r.json()['chain_valid'] == True, 'receipt chain broken'
          print('PASS: /api/receipts/verify -> chain valid')

          # Automation status (military grading)
          r = c.get('/api/automation/status')
          assert r.status_code == 200
          auto = r.json()
          assert auto['grade'] == 'MILITARY', f'expected MILITARY grade, got {auto.get(\"grade\")}'
          assert auto['endpoints']['/api/visit-back']['status'] == 'GREEN_REAL'
          assert auto['endpoints']['/api/blog/post']['status'] == 'BLACK_DISABLED'
          assert auto['endpoints']['/api/bio/post']['status'] == 'GREEN_REAL'
          print(f'PASS: /api/automation/status -> MILITARY grade, {len(auto[\"endpoints\"])} endpoints graded')

          print()
          print('ALL CI SMOKE TESTS PASSED')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rm-revenueops-ci .

      - name: Verify container starts
        run: |
          docker run -d --name rm-ci -p 7860:7860 rm-revenueops-ci
          sleep 5
          curl -s http://localhost:7860/api/health | grep -q "GREEN_REAL" && echo "Container health OK" || (echo "Container health FAILED" && exit 1)
          docker stop rm-ci && docker rm rm-ci
