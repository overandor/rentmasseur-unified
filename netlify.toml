[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/intake"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# Preserve access to the existing Hugging Face service pipeline.
[[redirects]]
  from = "/api/engine/*"
  to = "https://josephrw-rentmasseur-optimizer.hf.space/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/os/*"
  to = "https://josephrw-rentmasseur-optimizer.hf.space/api/os/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
