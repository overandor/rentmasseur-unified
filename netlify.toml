[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/intake"
  status = 200
  force = true

[[redirects]]
  from = "/api/trials"
  to = "/.netlify/functions/trials"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/engine/*"
  to = "https://josephrw-rentmasseur-optimizer.hf.space/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/os/*"
  to = "https://josephrw-rentmasseur-optimizer.hf.space/api/os/:splat"
  status = 200
  force = true

# Netlify is a traffic-collection node. All public page authority is
# consolidated into the canonical Vercel origin while paths and query
# parameters are preserved for attribution.
[[redirects]]
  from = "/*"
  to = "https://rentmasseur-unified-prod-happo.vercel.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, follow"
