name: Apply Dashboard Multicloud Routing

on:
  push:
    branches: [feature/masseurboost-real]
    paths:
      - integrations/masseurboost/patch_dashboard.py
      - .github/workflows/apply-dashboard-multicloud.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/masseurboost-real
          fetch-depth: 0
          lfs: false
      - run: python integrations/masseurboost/patch_dashboard.py integrations/hf-source/dashboard/index.html
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active=False; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script': self.active=True
              def handle_endtag(self, tag):
                  if tag == 'script': self.active=False
              def handle_data(self, data):
                  if self.active: self.parts.append(data)
          p=Parser(); p.feed(Path('integrations/hf-source/dashboard/index.html').read_text())
          Path('/tmp/dashboard.js').write_text('\n'.join(p.parts))
          PY
          node --check /tmp/dashboard.js
      - name: Commit routed dashboard
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integrations/hf-source/dashboard/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Route MasseurBoost trials through active multicloud host'
          git push origin HEAD:feature/masseurboost-real
