name: Mirror Hugging Face Spaces

on:
  workflow_dispatch:
  push:
    branches: [feature/masseurboost-real]
    paths:
      - .github/workflows/mirror-hf-spaces.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mirror-hf-spaces.yml
      - integrations/hf-source/**

permissions:
  contents: write

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/masseurboost-real
          fetch-depth: 0
          lfs: false

      - name: Clone public Hugging Face Spaces
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          rm -rf /tmp/rm-dashboard /tmp/rm-optimizer
          git clone --depth=1 https://huggingface.co/spaces/josephrw/rentmasseur-dashboard /tmp/rm-dashboard
          git clone --depth=1 https://huggingface.co/spaces/josephrw/rentmasseur-optimizer /tmp/rm-optimizer

      - name: Mirror source files
        run: |
          set -euo pipefail
          rm -rf integrations/hf-source
          mkdir -p integrations/hf-source/dashboard integrations/hf-source/optimizer
          rsync -a --delete \
            --exclude='.git/' --exclude='*.sqlite*' --exclude='*.db' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' \
            --exclude='*.gif' --exclude='*.webp' --exclude='*.mp4' --exclude='*.mov' --exclude='*.zip' --exclude='*.tar*' \
            /tmp/rm-dashboard/ integrations/hf-source/dashboard/
          rsync -a --delete \
            --exclude='.git/' --exclude='*.sqlite*' --exclude='*.db' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' \
            --exclude='*.gif' --exclude='*.webp' --exclude='*.mp4' --exclude='*.mov' --exclude='*.zip' --exclude='*.tar*' \
            /tmp/rm-optimizer/ integrations/hf-source/optimizer/
          find integrations/hf-source -type f -size +1M -delete
          find integrations/hf-source -type f -print | sort > integrations/hf-source/MANIFEST.txt

      - name: Commit mirrored source
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integrations/hf-source
          if git diff --cached --quiet; then
            echo "No mirror changes"
            exit 0
          fi
          git commit -m "Mirror current Hugging Face dashboard and optimizer source"
          git push origin HEAD:feature/masseurboost-real
