name: Validate MasseurBoost Real Functionality

on:
  push:
    branches: [feature/masseurboost-real]
    paths:
      - integrations/masseurboost/**
      - integrations/hf-source/dashboard/index.html
      - .github/workflows/apply-masseurboost-real.yml
  pull_request:
    branches: [main]
    paths:
      - integrations/masseurboost/**
      - integrations/hf-source/dashboard/index.html
      - .github/workflows/apply-masseurboost-real.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masseurboost-real-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Clone and patch public optimizer source
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          git clone --depth=1 https://huggingface.co/spaces/josephrw/rentmasseur-optimizer /tmp/rm-optimizer
          python integrations/masseurboost/patch_optimizer.py /tmp/rm-optimizer/cpp_os_server.cpp
          g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only /tmp/rm-optimizer/cpp_os_server.cpp

      - name: Validate dashboard JavaScript and claims
        run: |
          set -euo pipefail
          cp integrations/hf-source/dashboard/index.html /tmp/masseurboost.html
          python integrations/masseurboost/patch_dashboard.py /tmp/masseurboost.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.chunks = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script': self.in_script = True
              def handle_endtag(self, tag):
                  if tag == 'script': self.in_script = False
              def handle_data(self, data):
                  if self.in_script: self.chunks.append(data)

          html = Path('/tmp/masseurboost.html').read_text()
          parser = Scripts(); parser.feed(html)
          Path('/tmp/masseurboost.js').write_text('\n'.join(parser.chunks))
          forbidden = ['1,334', 'ZK-proof', 'All systems operational', 'using demo values', 'href="#"']
          found = [item for item in forbidden if item in html]
          if found: raise SystemExit(f'forbidden mock claims remain: {found}')
          required = ['/api/health', '/api/report', '/api/funnel/daily', '/api/kpis', '/api/candidates', '/api/receipts', '/api/trials', 'result.receiptId']
          missing = [item for item in required if item not in html]
          if missing: raise SystemExit(f'missing live endpoints: {missing}')
          print('dashboard contract validated')
          PY
          node --check /tmp/masseurboost.js
