name: Prune Temporary Hugging Face Mirror

on:
  push:
    branches: [feature/masseurboost-real]
    paths:
      - .github/workflows/prune-hf-mirror.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/masseurboost-real
          fetch-depth: 0
          lfs: false

      - name: Keep only deployable dashboard source
        run: |
          set -euo pipefail
          rm -rf integrations/hf-source/optimizer integrations/hf-source/MANIFEST.txt
          find integrations/hf-source/dashboard -mindepth 1 -maxdepth 1 ! -name index.html -exec rm -rf {} +

      - name: Commit mirror cleanup
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A integrations/hf-source
          if git diff --cached --quiet; then
            echo 'Mirror already pruned'
            exit 0
          fi
          git commit -m 'Prune temporary Hugging Face mirror from implementation branch'
          git push origin HEAD:feature/masseurboost-real
