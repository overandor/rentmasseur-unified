name: Deploy Real MasseurBoost

on:
  push:
    branches: [feature/masseurboost-real]
    paths:
      - integrations/hf-source/dashboard/index.html
      - integrations/masseurboost/**
      - .github/workflows/deploy-masseurboost-real.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-real-masseurboost
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DASHBOARD_SPACE: josephrw/rentmasseur-dashboard
      OPTIMIZER_SPACE: josephrw/rentmasseur-optimizer
      DASHBOARD_URL: https://josephrw-rentmasseur-dashboard.hf.space
      OPTIMIZER_URL: https://josephrw-rentmasseur-optimizer.hf.space
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/masseurboost-real
          lfs: false

      - name: Initialize deployment diagnostics
        run: echo checkout_complete > /tmp/deploy-stage

      - name: Require Hugging Face deployment token
        run: |
          set -euo pipefail
          echo token_check > /tmp/deploy-stage
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is not configured'; exit 1; }
          echo token_present > /tmp/deploy-stage

      - name: Clone target Spaces
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          echo clone_spaces > /tmp/deploy-stage
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          git clone "https://hf_user:${HF_TOKEN}@huggingface.co/spaces/${OPTIMIZER_SPACE}" /tmp/rm-optimizer
          git clone "https://hf_user:${HF_TOKEN}@huggingface.co/spaces/${DASHBOARD_SPACE}" /tmp/rm-dashboard
          echo spaces_cloned > /tmp/deploy-stage

      - name: Patch and compile-check optimizer
        run: |
          set -euo pipefail
          echo patch_optimizer > /tmp/deploy-stage
          python integrations/masseurboost/patch_optimizer.py /tmp/rm-optimizer/cpp_os_server.cpp
          g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only /tmp/rm-optimizer/cpp_os_server.cpp
          echo optimizer_compiled > /tmp/deploy-stage

      - name: Install real dashboard
        run: |
          set -euo pipefail
          echo validate_dashboard > /tmp/deploy-stage
          cp integrations/hf-source/dashboard/index.html /tmp/rm-dashboard/index.html
          grep -q '/api/trials' /tmp/rm-dashboard/index.html
          ! grep -q 'using demo values' /tmp/rm-dashboard/index.html
          ! grep -q '1,334' /tmp/rm-dashboard/index.html
          ! grep -q 'ZK-proof' /tmp/rm-dashboard/index.html
          echo dashboard_validated > /tmp/deploy-stage

      - name: Push optimizer update
        run: |
          set -euo pipefail
          echo push_optimizer > /tmp/deploy-stage
          cd /tmp/rm-optimizer
          git add cpp_os_server.cpp
          if ! git diff --cached --quiet; then
            git commit -m "Add receipt-backed public trial intake"
            if ! output=$(git push origin HEAD:main 2>&1); then
              printf '%s\n' "$output" | sed "s/${HF_TOKEN}/***/g" > /tmp/deploy-error
              cat /tmp/deploy-error
              exit 1
            fi
          else
            echo 'Optimizer already current'
          fi
          echo optimizer_pushed > /tmp/deploy-stage

      - name: Push dashboard update
        run: |
          set -euo pipefail
          echo push_dashboard > /tmp/deploy-stage
          cd /tmp/rm-dashboard
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Replace mock dashboard with live evidence-driven UI"
            if ! output=$(git push origin HEAD:main 2>&1); then
              printf '%s\n' "$output" | sed "s/${HF_TOKEN}/***/g" > /tmp/deploy-error
              cat /tmp/deploy-error
              exit 1
            fi
          else
            echo 'Dashboard already current'
          fi
          echo dashboard_pushed > /tmp/deploy-stage

      - name: Verify live optimizer and dashboard
        run: |
          set -euo pipefail
          echo verify_live > /tmp/deploy-stage
          optimizer_ok=0
          dashboard_ok=0
          for attempt in $(seq 1 8); do
            echo "Verification attempt ${attempt}/8"
            if curl -fsS --max-time 25 "${OPTIMIZER_URL}/api/health" | tee /tmp/health.json | grep -Eq 'GREEN_REAL|"status":"ok"'; then
              if curl -fsS --max-time 25 "${OPTIMIZER_URL}/api/trials" | tee /tmp/trials.json | grep -q 'trial_count'; then optimizer_ok=1; fi
            fi
            if curl -fsS --max-time 25 "${DASHBOARD_URL}/" | tee /tmp/dashboard.html | grep -q 'proof instead of theater'; then dashboard_ok=1; fi
            if [[ "$optimizer_ok" == 1 && "$dashboard_ok" == 1 ]]; then
              echo verified_live > /tmp/deploy-stage
              exit 0
            fi
            sleep 25
          done
          printf 'optimizer_ok=%s dashboard_ok=%s\n' "$optimizer_ok" "$dashboard_ok" > /tmp/deploy-error
          exit 1

      - name: Commit deployment receipt
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          stage = Path('/tmp/deploy-stage').read_text().strip() if Path('/tmp/deploy-stage').exists() else 'unknown'
          error = Path('/tmp/deploy-error').read_text(errors='replace')[-1200:].strip() if Path('/tmp/deploy-error').exists() else ''
          token = os.environ.get('HF_TOKEN', '')
          if token: error = error.replace(token, '***')
          data = {
              'workflow': 'Deploy Real MasseurBoost',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'status': os.environ['DEPLOY_STATUS'],
              'last_stage': stage,
              'hf_token_configured': bool(token),
              'error_tail': error,
              'source_commit': os.environ['GITHUB_SHA'],
              'dashboard_space': os.environ['DASHBOARD_SPACE'],
              'optimizer_space': os.environ['OPTIMIZER_SPACE'],
          }
          path = Path('receipts/masseurboost-deploy.json')
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add receipts/masseurboost-deploy.json
          git commit -m "Record MasseurBoost deployment ${DEPLOY_STATUS}" || exit 0
          git push origin HEAD:feature/masseurboost-real
